save_group:
  name: Zapisz grupę pomieszczeń
  description: Tworzy nową grupę albo aktualizuje grupę o podanym identyfikatorze.
  fields:
    vacuum_entity:
      name: Odkurzacz
      description: Wskaż odkurzacz, jeśli skonfigurowano więcej niż jeden.
      required: false
      selector:
        entity:
          domain: vacuum
    name:
      name: Nazwa
      required: true
      selector:
        text:
    map_id:
      name: ID mapy
      required: true
      selector:
        number:
          min: 1
          mode: box
    segments:
      name: ID pomieszczeń
      description: Lista identyfikatorów segmentów z wybranej mapy.
      required: true
      selector:
        object:
    group_id:
      name: ID istniejącej grupy
      required: false
      selector:
        text:

delete_group:
  name: Usuń grupę pomieszczeń
  fields:
    vacuum_entity:
      name: Odkurzacz
      description: Wskaż odkurzacz, jeśli skonfigurowano więcej niż jeden.
      required: false
      selector:
        entity:
          domain: vacuum
    group_id:
      name: ID grupy
      required: true
      selector:
        text:

log_maintenance:
  name: Zapisz czynność konserwacyjną
  description: Dodaje wymianę, czyszczenie lub inną czynność do historii robota.
  fields:
    vacuum_entity:
      name: Odkurzacz
      required: false
      selector:
        entity:
          domain: vacuum
    item:
      name: Element
      required: true
      selector:
        text:
    action:
      name: Czynność
      required: true
      selector:
        text:
    note:
      name: Notatka
      required: false
      selector:
        text:

save_schedule:
  name: Zapisz harmonogram
  description: Tworzy lub aktualizuje harmonogram sprzątania.
  fields:
    vacuum_entity:
      selector:
        entity:
          domain: vacuum
    name:
      required: true
      selector:
        text:
    map_id:
      required: true
      selector:
        number:
          mode: box
    segments:
      required: true
      selector:
        object:
    days:
      required: true
      selector:
        object:
    time:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    repeats:
      required: false
      selector:
        number:
          min: 1
          max: 3
    suction_level:
      required: false
      selector:
        number:
          min: 0
          max: 3
    water_volume:
      required: false
      selector:
        number:
          min: 1
          max: 3
    cleaning_type:
      required: false
      selector:
        select:
          options:
            - custom
            - cleangenius
    cleangenius:
      required: false
      selector:
        select:
          options:
            - routine_cleaning
            - deep_cleaning
    cleangenius_mode:
      required: false
      selector:
        select:
          options:
            - vacuum_and_mop
            - mop_after_vacuum
    settings_mode:
      required: false
      selector:
        select:
          options:
            - shared
            - individual
    shared_settings:
      required: false
      selector:
        object:
    room_settings:
      required: false
      selector:
        object:
    schedule_id:
      required: false
      selector:
        text:

delete_schedule:
  name: Usuń harmonogram
  fields:
    vacuum_entity:
      selector:
        entity:
          domain: vacuum
    schedule_id:
      required: true
      selector:
        text:

run_schedule:
  name: Uruchom harmonogram
  fields:
    vacuum_entity:
      selector:
        entity:
          domain: vacuum
    schedule_id:
      required: true
      selector:
        text:
