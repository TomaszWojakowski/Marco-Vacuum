save_group:
  name: Zapisz grupę pomieszczeń
  description: Tworzy nową grupę albo aktualizuje grupę o podanym identyfikatorze.
  fields:
    vacuum_entity:
      name: Odkurzacz
      description: Wskaż odkurzacz, jeśli skonfigurowano więcej niż jeden.
      required: false
      selector:
        entity:
          domain: vacuum
    name:
      name: Nazwa
      required: true
      selector:
        text:
    map_id:
      name: ID mapy
      required: true
      selector:
        number:
          min: 1
          mode: box
    segments:
      name: ID pomieszczeń
      description: Lista identyfikatorów segmentów z wybranej mapy.
      required: true
      selector:
        object:
    group_id:
      name: ID istniejącej grupy
      required: false
      selector:
        text:

delete_group:
  name: Usuń grupę pomieszczeń
  fields:
    vacuum_entity:
      name: Odkurzacz
      description: Wskaż odkurzacz, jeśli skonfigurowano więcej niż jeden.
      required: false
      selector:
        entity:
          domain: vacuum
    group_id:
      name: ID grupy
      required: true
      selector:
        text:
